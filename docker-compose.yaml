services:
  jenkins:
    build:
      context: ./jenkins
    container_name: devsecops-jenkins
    ports:
      - "${JENKINS_HOST_PORT:-8082}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sonarqube:
    image: sonarqube:community
    container_name: devsecops-sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "${SONARQUBE_HOST_PORT:-9002}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192

  sonarqube-db:
    image: postgres:16
    container_name: devsecops-sonarqube-db
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONAR_JDBC_USERNAME:-sonarqube}
      POSTGRES_PASSWORD: ${SONAR_JDBC_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_db:/var/lib/postgresql/data

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
